services:
  # Backend API Service
  - type: web
    name: eduflow-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    rootDir: backend
    pythonVersion: 3.11.0
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./lms.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /api/health

  # Frontend Static Site Service
  - type: web
    name: eduflow-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://eduflow-backend.onrender.com/api  # Update with your actual backend URL
      - key: VITE_NODE_ENV
        value: production
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

services:
  # Backend API Service
  - type: web
    name: eduflow-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    rootDir: backend
    # Note: pythonVersion is optional if runtime.txt is correct
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./lms.db
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
    healthCheckPath: /api/health

  # Frontend Static Site Service
  - type: web
    name: eduflow-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_NODE_ENV
        value: production
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
